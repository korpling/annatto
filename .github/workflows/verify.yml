name: Verify

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  merge-request-checks:
    name: Run verify.sh
    runs-on: ubuntu-24.04
    env:
      RUST_BACKTRACE: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install diff-cover
        uses: threeal/pipx-install-action@v1.0.0
        with:
          packages: diff-cover
      - uses: actions-rust-lang/setup-rust-toolchain@v1.4.4
        with:
          toolchain: stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run verify.sh
        run: ./verify.sh
      - name: Generate code coverage comment
        id: pr
        run: |
          {
            echo 'COVERAGE_INFO<<EOF'
            diff-cover target/llvm-cov/tests.lcov
            echo EOF
          } >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_OUTPUT: TRUE
      - uses: mshick/add-pr-comment@v3
        # Check if the event is not triggered by a fork before attempting to add a comment
        # see https://github.com/peter-evans/create-pull-request/blob/main/docs/concepts-guidelines.md#restrictions-on-repository-forks
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          message: |
            Commit ${{ github.event.pull_request.head.sha }}
            ```
            ${{env.COVERAGE_INFO}}
            ```
